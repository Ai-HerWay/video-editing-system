<!doctype html>
<html lang="en" data-composition-id="tactile-caption" data-composition-duration="8">
  <head><meta charset="UTF-8" /><title>Tactile Caption</title></head>
  <body>
    <template>
      <div id="root" data-composition-id="tactile-caption" data-start="0" data-duration="8" data-fps="30" data-width="1080" data-height="1920">
        <style>
          @font-face { font-family: "Playfair Display"; src: url("assets/fonts/playfair-display-var.woff2") format("woff2"); font-weight: 400 900; font-style: normal; }
          @font-face { font-family: "Montserrat"; src: url("assets/fonts/montserrat-var.woff2") format("woff2"); font-weight: 400 700; font-style: normal; }
          * { box-sizing: border-box; }
          #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
          #caption-stage { position: absolute; left: 120px; right: 120px; top: 1190px; height: 150px; display: grid; place-items: center; }
          .cue { position: absolute; max-width: 840px; padding: 16px 25px 18px; background: var(--tpc-sheet, #fffaf0); border: 4px solid var(--tpc-ink, #25231f); box-shadow: 7px 7px 0 var(--tpc-ink, #25231f); color: var(--tpc-ink, #25231f); font: 700 46px/1.12 "Montserrat", sans-serif; text-align: center; opacity: 0; transform: rotate(-1deg); }
          .word { display: inline-block; margin: 0 4px; }
          .word.active { color: var(--tpc-primary, #3159c8); transform: scale(1.05); }
        </style>
        <div id="caption-stage"></div>
      </div>
      <script>
      (() => {
        const compositionId = "tactile-caption";
        const words = [
          { text: "Replace", start: 0.2, end: 0.7 },
          { text: "with", start: 0.72, end: 1.0 },
          { text: "timed", start: 1.02, end: 1.45 },
          { text: "words", start: 1.47, end: 2.0 }
        ];
        const groups = [];
        let current = [];
        words.forEach((word, index) => {
          current.push(word);
          const next = words[index + 1];
          const pause = next ? next.start - word.end >= 0.15 : true;
          const punctuation = /[,.!?]$/.test(word.text);
          if (current.length >= 4 || pause || punctuation || !next) {
            groups.push({ words: current, start: current[0].start, end: current[current.length - 1].end });
            current = [];
          }
        });
        const stage = document.getElementById("caption-stage");
        groups.forEach((group, groupIndex) => {
          const cue = document.createElement("div");
          cue.className = "cue";
          cue.id = `tpc-cue-${groupIndex}`;
          group.words.forEach((word, wordIndex) => {
            const span = document.createElement("span");
            span.className = "word";
            span.id = `tpc-cue-${groupIndex}-word-${wordIndex}`;
            span.textContent = word.text.replace(/[,.!?]+$/g, "");
            cue.appendChild(span);
          });
          stage.appendChild(cue);
        });
        const timeline = gsap.timeline({ paused: true });
        groups.forEach((group, groupIndex) => {
          const cue = `#tpc-cue-${groupIndex}`;
          timeline.set(cue, { opacity: 1 }, group.start);
          timeline.set(cue, { opacity: 0 }, group.end + 0.12);
          group.words.forEach((word, wordIndex) => {
            const target = `#tpc-cue-${groupIndex}-word-${wordIndex}`;
            if (wordIndex > 0) timeline.set(`#tpc-cue-${groupIndex}-word-${wordIndex - 1}`, { color: "var(--tpc-ink, #25231f)", scale: 1 }, word.start);
            timeline.set(target, { color: "var(--tpc-primary, #3159c8)", scale: 1.05 }, word.start);
          });
        });
        window.__timelines = window.__timelines || {};
        window.__timelines[compositionId] = timeline;
      })();
      </script>
    </template>
  </body>
</html>

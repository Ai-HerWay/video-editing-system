<!doctype html>
<html lang="en" data-composition-id="tactile-caption" data-composition-duration="8">
  <head><meta charset="UTF-8" /><title>Tactile Caption</title></head>
  <body>
    <template>
      <div id="root" data-composition-id="tactile-caption" data-start="0" data-duration="8" data-fps="30" data-width="1080" data-height="1920">
        <style>
          @font-face { font-family: "Playfair Display"; src: url("assets/fonts/playfair-display-var.woff2") format("woff2"); font-weight: 400 900; font-style: normal; }
          @font-face { font-family: "Montserrat"; src: url("assets/fonts/montserrat-var.woff2") format("woff2"); font-weight: 400 700; font-style: normal; }
          * { box-sizing: border-box; }
          #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; pointer-events: none; }
          .ahw-tactile-caption { position: absolute; left: 120px; right: 120px; top: 1190px; height: 150px; display: grid; place-items: center; }
          .ahw-tactile-cue {
            position: absolute;
            max-width: 840px;
            padding: 16px 25px 18px;
            text-align: center;
            font: 700 46px/1.12 "Montserrat", sans-serif;
            color: var(--ahw-ink, #2B1E19);
            background: var(--ahw-card, #FAF6EF);
            border: 4px solid var(--ahw-ink, #2B1E19);
            box-shadow: 7px 7px 0 var(--ahw-ink, #2B1E19);
            transform: rotate(-1deg);
            opacity: 0;
          }
          .ahw-tactile-token { display: inline-block; margin: 0 4px; }
          .ahw-tactile-token--lit { color: var(--ahw-accent, #C4D6DA); transform: scale(1.05); }
        </style>
        <div class="ahw-tactile-caption"></div>
      </div>
      <script>
      (() => {
        const compositionId = "tactile-caption";

        // Word-level timings for this cue lane. Replace with corrected timings.
        const words = [
          { text: "Replace", start: 0.2, end: 0.7 },
          { text: "with", start: 0.72, end: 1.0 },
          { text: "timed", start: 1.02, end: 1.45 },
          { text: "words", start: 1.47, end: 2.0 }
        ];

        // Break the stream into cues at punctuation, a >=0.15s gap, or four words.
        const PAUSE = 0.15;
        const MAX_WORDS = 4;
        const cues = [];
        let pending = [];
        const flush = () => {
          if (!pending.length) return;
          cues.push({ tokens: pending, start: pending[0].start, end: pending[pending.length - 1].end });
          pending = [];
        };
        words.forEach((word, i) => {
          pending.push(word);
          const nextWord = words[i + 1];
          const gapBreak = !nextWord || nextWord.start - word.end >= PAUSE;
          const punctBreak = /[,.!?]$/.test(word.text);
          if (pending.length >= MAX_WORDS || gapBreak || punctBreak) flush();
        });

        const stage = document.querySelector(".ahw-tactile-caption");
        const cleanText = (raw) => raw.replace(/[,.!?]+$/g, "");
        cues.forEach((cue, cueIndex) => {
          const cueEl = document.createElement("div");
          cueEl.className = "ahw-tactile-cue";
          cueEl.id = `ahw-cue-${cueIndex}`;
          cue.tokenIds = cue.tokens.map((word, tokenIndex) => {
            const tokenId = `ahw-cue-${cueIndex}-tok-${tokenIndex}`;
            const tokenEl = document.createElement("span");
            tokenEl.className = "ahw-tactile-token";
            tokenEl.id = tokenId;
            tokenEl.textContent = cleanText(word.text);
            cueEl.appendChild(tokenEl);
            return tokenId;
          });
          stage.appendChild(cueEl);
        });

        const litColor = "var(--ahw-accent, #C4D6DA)";
        const inkColor = "var(--ahw-ink, #2B1E19)";
        const timeline = gsap.timeline({ paused: true });
        cues.forEach((cue, cueIndex) => {
          const cueSelector = `#ahw-cue-${cueIndex}`;
          timeline.set(cueSelector, { opacity: 1 }, cue.start);
          timeline.set(cueSelector, { opacity: 0 }, cue.end + 0.12);
          cue.tokens.forEach((word, tokenIndex) => {
            if (tokenIndex > 0) {
              timeline.set(`#${cue.tokenIds[tokenIndex - 1]}`, { color: inkColor, scale: 1 }, word.start);
            }
            timeline.set(`#${cue.tokenIds[tokenIndex]}`, { color: litColor, scale: 1.05 }, word.start);
          });
        });

        window.__timelines = window.__timelines || {};
        window.__timelines[compositionId] = timeline;
      })();
      </script>
    </template>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Quiet Editorial caption</title>
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Playfair Display";
          src: url("fonts/PlayfairDisplay-var.woff2") format("woff2");
          font-style: normal;
          font-weight: 400 900;
        }
        @font-face {
          font-family: "Playfair Display";
          src: url("fonts/PlayfairDisplay-Italic-var.woff2") format("woff2");
          font-style: italic;
          font-weight: 400 900;
        }
        @font-face {
          font-family: "Montserrat";
          src: url("fonts/Montserrat-var.woff2") format("woff2");
          font-style: normal;
          font-weight: 400 900;
        }
        .ahw-editorial-caption-stage {
          position: absolute;
          inset: 0;
          overflow: visible;
          pointer-events: none;
        }
        .ahw-editorial-caption-cue {
          position: absolute;
          left: 0;
          top: calc(var(--ahw-caption-center-y) - 80px);
          width: 100%;
          height: 160px;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 0 var(--ahw-caption-inset);
          overflow: visible;
          opacity: 0;
          visibility: hidden;
          color: #2B1E19;
          font-family: "Montserrat", sans-serif;
          font-weight: 700;
          line-height: 1.05;
          text-align: center;
          white-space: nowrap;
        }
        .ahw-editorial-caption-line {
          display: inline-flex;
          align-items: baseline;
          justify-content: center;
          gap: 0.24em;
          max-width: var(--ahw-caption-max-width);
          white-space: nowrap;
        }
        .ahw-editorial-caption-line.framed {
          padding: 18px 28px 20px;
          border: 2px solid #C0CACE;
          border-radius: 16px;
          background: rgba(250, 246, 239, 0.94);
          box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
        }
        .ahw-editorial-caption-word {
          display: inline-block;
        }
        .ahw-editorial-caption-word.accent {
          font-family: "Playfair Display", serif;
          font-style: italic;
          font-weight: 400;
          letter-spacing: -0.035em;
          color: #7B5A49;
        }
        .ahw-editorial-caption-word.confirm {
          color: #AAB6A0;
        }
      </style>

      <div
        id="ahw-editorial-caption-root"
        data-composition-id="quiet-editorial-caption"
        data-start="0"
        data-duration="6.8"
        data-width="1080"
        data-height="1920"
        style="position:absolute;inset:0;width:1080px;height:1920px;overflow:visible;pointer-events:none"
      >
        <div class="ahw-editorial-caption-stage" id="ahw-editorial-caption-flow"></div>
      </div>

      <script>
        (function () {
          // ---- Authoring inputs -------------------------------------------
          const CONFIG = {
            transcript: [
              { id: "w0", text: "Make", start: 0.2, end: 0.58 },
              { id: "w1", text: "the", start: 0.6, end: 0.76 },
              { id: "w2", text: "complex", start: 0.78, end: 1.25 },
              { id: "w3", text: "feel", start: 1.4, end: 1.72 },
              { id: "w4", text: "clear.", start: 1.74, end: 2.22 },
            ],
            accentWords: ["clear"],
            confirmWords: [],
            ground: "framed", // "clean" | "framed"
            wordsPerCue: 2,
            pauseGap: 0.15,
          };

          // ---- Frame + lane geometry --------------------------------------
          const root = document.getElementById("ahw-editorial-caption-root");
          const stage = document.getElementById("ahw-editorial-caption-flow");
          const frameW = Number(root.dataset.width);
          const frameH = Number(root.dataset.height);
          const shortEdge = Math.min(frameW, frameH);
          const aspect = frameW / frameH;

          function laneFor(a) {
            if (a < 0.75) {
              return { maxWidth: frameW * (840 / 1080), centerY: frameH * (1270 / 1920), inset: frameW * (120 / 1080) };
            }
            if (a > 1.25) {
              return { maxWidth: frameW * (1640 / 1920), centerY: frameH * (890 / 1080), inset: frameW * (140 / 1920) };
            }
            return { maxWidth: frameW * (900 / 1080), centerY: frameH * (840 / 1080), inset: frameW * (90 / 1080) };
          }
          const lane = laneFor(aspect);
          root.style.setProperty("--ahw-caption-max-width", lane.maxWidth + "px");
          root.style.setProperty("--ahw-caption-center-y", lane.centerY + "px");
          root.style.setProperty("--ahw-caption-inset", lane.inset + "px");

          // ---- Word cleaning + cue grouping -------------------------------
          const stripToken = (raw) => String(raw || "").replace(/[^\p{L}\p{N}'’-]+/gu, "").trim();
          const endsSentence = (raw) => /[.!?,;:]$/.test(String(raw).trim());

          function buildCues(words, opts) {
            const cues = [];
            let pending = [];
            for (let i = 0; i < words.length; i += 1) {
              const raw = String(words[i].text || "");
              const display = stripToken(raw);
              if (!display) continue;
              pending.push({ ...words[i], display });

              const next = words[i + 1];
              const gap = next ? Number(next.start) - Number(words[i].end) : Infinity;
              const softBreak = pending.length >= 2 && (endsSentence(raw) || gap >= opts.pauseGap);
              const atCap = pending.length >= opts.wordsPerCue;

              if (atCap || softBreak || !next) {
                cues.push({
                  words: pending,
                  start: Number(pending[0].start),
                  end: Number(pending[pending.length - 1].end),
                });
                pending = [];
              }
            }
            return cues;
          }

          const accentSet = new Set(CONFIG.accentWords.map((w) => w.toLowerCase()));
          const confirmSet = new Set(CONFIG.confirmWords.map((w) => w.toLowerCase()));
          const cues = buildCues(CONFIG.transcript, CONFIG);

          // ---- Render one cue's DOM ---------------------------------------
          function renderCue(cue, index) {
            const cueEl = document.createElement("div");
            cueEl.className = "ahw-editorial-caption-cue";
            cueEl.id = "ahw-caption-cue-" + index;

            const lineEl = document.createElement("div");
            lineEl.className = "ahw-editorial-caption-line" + (CONFIG.ground === "framed" ? " framed" : "");

            cue.words.forEach((word, wi) => {
              const key = word.display.toLowerCase();
              const wordEl = document.createElement("span");
              wordEl.className =
                "ahw-editorial-caption-word" +
                (accentSet.has(key) ? " accent" : "") +
                (confirmSet.has(key) ? " confirm" : "");
              wordEl.id = "ahw-caption-word-" + index + "-" + wi;
              wordEl.textContent = word.display;
              lineEl.appendChild(wordEl);
            });

            cueEl.appendChild(lineEl);
            stage.appendChild(cueEl);
            return cueEl;
          }

          // ---- Fit each cue to its safe width -----------------------------
          function fitCue(cueEl, cue) {
            const phrase = cue.words.map((w) => w.display).join(" ");
            const hasAccent = cue.words.some((w) => accentSet.has(w.display.toLowerCase()));
            const guard = hasAccent ? 1.06 : 1;
            const sized = window.__hyperframes && window.__hyperframes.fitTextFontSize
              ? window.__hyperframes.fitTextFontSize(phrase, {
                  fontFamily: "Montserrat",
                  fontWeight: 700,
                  maxWidth: lane.maxWidth / guard,
                  baseFontSize: Math.round(shortEdge * (112 / 1080)),
                  minFontSize: Math.round(shortEdge * (96 / 1080)),
                  step: 2,
                })
              : { fontSize: Math.round(shortEdge * (96 / 1080)) };
            cueEl.style.fontSize = sized.fontSize + "px";
          }

          // ---- Timeline: enter, hold, exit, hard-hide ---------------------
          const timeline = gsap.timeline({ paused: true });

          function scheduleCue(cueEl, cue) {
            const enterEnd = Math.min(cue.start + 0.28, cue.end - 0.13);
            const exitStart = Math.max(enterEnd, cue.end - 0.12);
            timeline.set(cueEl, { visibility: "visible", opacity: 0 }, cue.start);
            timeline.fromTo(
              cueEl,
              { opacity: 0, y: 18 },
              { opacity: 1, y: 0, duration: Math.max(0.01, enterEnd - cue.start), ease: "power3.out" },
              cue.start,
            );
            timeline.to(
              cueEl,
              { opacity: 0, y: -8, duration: Math.max(0.01, cue.end - exitStart), ease: "power2.in" },
              exitStart,
            );
            timeline.set(cueEl, { opacity: 0, visibility: "hidden" }, cue.end);
          }

          const cueEls = cues.map((cue, index) => {
            const cueEl = renderCue(cue, index);
            fitCue(cueEl, cue);
            scheduleCue(cueEl, cue);
            return cueEl;
          });

          // ---- Self-check: nothing lingers past its cue end ---------------
          cues.forEach((cue, index) => {
            timeline.seek(cue.end + 0.01);
            const style = window.getComputedStyle(cueEls[index]);
            if (style.opacity !== "0" && style.visibility !== "hidden") {
              console.warn("[quiet-editorial-caption] cue " + index + " remains visible after its end");
            }
          });
          timeline.seek(0);

          window.__timelines = window.__timelines || {};
          window.__timelines["quiet-editorial-caption"] = timeline;
        })();
      </script>
    </template>
  </body>
</html>
